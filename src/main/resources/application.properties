quarkus.application.name=inventory-service
quarkus.http.port=${HTTP_PORT:8081}

# --- datasource: dev and prod read the environment, secrets without default; test and it use Dev Services ---
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL}
%dev,prod.quarkus.datasource.username=${DB_USERNAME}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:16}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.image-name=docker.io/library/postgres:16-alpine
quarkus.datasource.devservices.db-name=inventory
%dev.quarkus.devservices.enabled=false

# --- every service owns one schema, so several services can share a database ---
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=${DB_SCHEMA:inventory}
quarkus.flyway.schemas=${DB_SCHEMA:inventory}

# --- kafka ---
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%dev,prod.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
%dev,prod.kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
%dev,prod.kafka.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.orders-placed.connector=smallrye-kafka
mp.messaging.incoming.orders-placed.topic=${ORDERS_PLACED_TOPIC:orders.placed}
mp.messaging.incoming.orders-placed.group.id=${quarkus.application.name}
mp.messaging.incoming.orders-placed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-placed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-placed.auto.offset.reset=earliest
mp.messaging.incoming.orders-placed.failure-strategy=dead-letter-queue
mp.messaging.incoming.orders-placed.dead-letter-queue.topic=${ORDERS_PLACED_TOPIC:orders.placed}.dlq

# --- application ---
inventory.topics.inventory-reserved=${INVENTORY_RESERVED_TOPIC:inventory.reserved}
inventory.topics.inventory-rejected=${INVENTORY_REJECTED_TOPIC:inventory.rejected}
inventory.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1s}
inventory.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}

# --- observability ---
quarkus.log.console.json.enabled=${LOG_JSON:false}
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.micrometer.export.prometheus.enabled=true
quarkus.smallrye-openapi.info-title=Inventory Service API
quarkus.smallrye-openapi.info-version=1.0.0

# --- tests: jacoco output; in-memory channels come from InMemoryMessagingProfile ---
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report-location=target/site/jacoco

# --- @QuarkusIntegrationTest runs the packaged app against Dev Services (Postgres + Kafka) ---
quarkus.test.integration-test-profile=it
quarkus.http.test-port=0
